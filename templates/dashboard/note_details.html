{% extends "layout/base.html" %} {% block title %}{{ note.title }}{% endblock %}
{% block content %}

<section class="create-note-section">
  <div class="create-note-container">
    <div class="note-details-header">
      <h1>{{ note.title }}</h1>
      <small
        >Last updated: {{ note.updated_at.strftime('%d %b %Y, %I:%M %p')
        }}</small
      >
    </div>

    <div class="note-details-content">
      <p>{{ note.content }}</p>
    </div>

    <div class="note-actions">
      <a
        href="{{ url_for('notes.edit_note', note_id=note.id) }}"
        class="btn-primary"
      >
        Edit
      </a>

      <form
        action="{{ url_for('notes.delete_note', note_id=note.id) }}"
        method="POST"
      >
        <button
          type="submit"
          class="btn-danger"
          onclick="return confirm('Delete this note?');"
        >
          Delete
        </button>
      </form>

      <a href="{{ url_for('main.dashboard') }}" class="btn-secondary">
        Back to Dashboard
      </a>
    </div>
  </div>
</section>

{% endblock %}
