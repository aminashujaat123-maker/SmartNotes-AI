{% extends "layout/base.html" %} {% block title %}Sign Up{% endblock %} {% block
content %}

<section class="auth-section">
  <div class="auth-container">
    <div class="auth-left">
      <h1>Join SmartNotes AI 🚀</h1>

      <p>
        Create your free account and start organizing your notes with AI-powered
        tools.
      </p>
    </div>

    <div class="auth-right">
      <div class="auth-card">
        <h2>Create Account</h2>

        <form method="POST">
          <div class="form-group">
            <label>Full Name</label>

            <input
              type="text"
              name="full_name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label>Email</label>

            <input
              type="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label>Password</label>

            <input
              type="password"
              name="password"
              placeholder="Create a password"
              required
            />
          </div>

          <div class="form-group">
            <label>Confirm Password</label>

            <input
              type="password"
              name="confirm_password"
              placeholder="Confirm your password"
              required
            />
          </div>

          <button type="submit" class="btn-primary auth-btn">
            Create Account
          </button>
        </form>

        <p class="auth-link">
          Already have an account?

          <a href="/login"> Login </a>
        </p>
      </div>
    </div>
  </div>
</section>

{% endblock %}
