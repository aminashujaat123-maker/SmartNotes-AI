{% extends "layout/base.html" %} {% block title %}Login{% endblock %} {% block
content %}

<section class="auth-section">
  <div class="auth-container">
    <div class="auth-left">
      <h1>Welcome Back 👋</h1>

      <p>
        Sign in to access your SmartNotes AI dashboard, manage your notes and
        continue your learning journey.
      </p>
    </div>

    <div class="auth-right">
      <div class="auth-card">
        <h2>Login</h2>

        <form method="POST">
          <div class="form-group">
            <label>Email</label>

            <input
              type="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label>Password</label>

            <input
              type="password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <button type="submit" class="btn-primary auth-btn">Login</button>
        </form>

        <p class="auth-link">
          Don't have an account?

          <a href="/signup"> Create Account </a>
        </p>
      </div>
    </div>
  </div>
</section>

{% endblock %}
