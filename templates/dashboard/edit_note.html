{% extends "layout/base.html" %} {% block title %}Edit Note{% endblock %} {%
block content %}

<h1>Edit Note</h1>

<form method="POST">
  <div class="form-group">
    <label>Title</label>

    <input type="text" name="title" value="{{ note.title }}" required />
  </div>

  <br />

  <div class="form-group">
    <label>Content</label>

    <textarea name="content" rows="10" required>{{ note.content }}</textarea>
  </div>

  <br />

  <button class="btn-primary">Update Note</button>
</form>

{% endblock %}
